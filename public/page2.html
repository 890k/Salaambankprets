<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Codsiga Daynta</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bank-primary: #008751;
            --bank-hover: #006d41;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--bank-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: #ffffff; }
        .header-title .salaam { color: #ffd700; margin-right: 4px; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; }
        .main-title { font-size: 26px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--bank-primary); }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px; background-color: #ffffff; color: #333333; outline: none; width: 100%; }
        .form-control:focus { border-color: var(--bank-primary); }
        textarea.form-control { resize: none; height: 95px; font-family: inherit; }
        .btn-next { background-color: var(--bank-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a href="/" class="back-btn">← Noqo</a>
    <div class="header-title"><span class="salaam">Salaam</span> Bank</div>
    <div class="menu-icon" style="color:white; font-size:24px;">☰</div>
</div>

<div class="card">
    <h1 class="main-title">Codsiga Daynta</h1>
    <div class="subtext">Tallaabada 1 ee 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Nooca Daynta</label>
            <select id="loanType" class="form-control" required>
                <option value="Daynta Shakhsiga ah" selected>Daynta Shakhsiga ah</option>
                <option value="Daynta Ganacsiga">Daynta Ganacsiga</option>
                <option value="Daynta Waxbarashada">Daynta Waxbarashada</option>
                <option value="Daynta Degdegga ah">Daynta Degdegga ah</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Qaddarka Daynta ($)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="2500" value="2500" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Muddada Daynta</label>
            <select id="loanTerm" class="form-control" required>
                <option value="3 Bilood">3 Bilood</option>
                <option value="6 Bilood">6 Bilood</option>
                <option value="12 Bilood" selected>12 Bilood</option>
                <option value="24 Bilood">24 Bilood</option>
                <option value="36 Bilood">36 Bilood</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Ujeeddada Daynta</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Maxaa lacagtan loogu talagalay?" required></textarea>
        </div>

        <button type="submit" class="btn-next">TALLAABADA XIGTA</button>
    </form>
</div>

<div class="footer-banner">© 2026 Salaam Bank Somalia</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount');
        if (savedAmount) document.getElementById('loanAmt').value = savedAmount.replace(/\D/g, '');
    };

    function submitStep1(event) {
        event.preventDefault();
        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('loan_term', months);
        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        window.location.href = "/page3";
    }
</script>
</body>
</html>
