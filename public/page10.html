<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Guul</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bank-primary: #008751;
            --bg-color: #008751;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-gray: #666666;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .screen-container { width: 100%; max-width: 400px; background-color: var(--card-bg); border-radius: 28px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; }
        .check-circle { width: 80px; height: 80px; background: var(--bank-primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; margin-bottom: 20px; }
        .congrats-title { font-size: 24px; font-weight: 800; color: #000; margin-bottom: 12px; }
        .sub-text { color: var(--text-gray); font-size: 15px; text-align: center; margin-bottom: 25px; }
        .amount-box { width: 100%; background: var(--bank-primary); border-radius: 16px; padding: 22px 15px; text-align: center; color: white; margin-bottom: 25px; }
        .amount-value { font-size: 32px; font-weight: 900; }
        .home-btn { background-color: var(--bank-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="screen-container">
        <div class="check-circle">✓</div>
        <div class="congrats-title">🎉 Hambalyo!</div>
        <div class="sub-text">Dayntaadii waa la <b>oggolaaday!</b> Lacagta waxaa laguugu shubi doonaa akoonkaaga dhowaan.</div>

        <div class="amount-box">
            <div style="font-size:12px; font-weight:800; text-transform:uppercase;">Qaddarka La Oggolaaday</div>
            <div class="amount-value" id="display-amount">$2,500</div>
        </div>

        <button class="home-btn" onclick="window.location.href='/'">🏠 Ku Noqo Bogga Hore</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loanAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount') || "2500";
            document.getElementById('display-amount').innerText = `$${Number(loanAmount).toLocaleString()}`;
        });
    </script>
</body>
</html>
